name: Engineering checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Regression (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      OPENAI_API_KEY: ''
      UV_NO_PROGRESS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.8'
          cache: pip
          cache-dependency-path: uv.lock
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.14.0'
      - name: Install fixed tooling (network allowed)
        run: python -m pip install uv==0.13.1
      - name: Install locked dependencies (network allowed)
        run: uv sync --locked --python 3.12.8
      - name: Scan tracked source for credential patterns
        run: uv run --no-sync python scripts/checks/scan_secrets.py
      - name: Offline engineering regression
        run: uv run --no-sync python scripts/check.py
      - name: Upload only test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: engineering-${{ matrix.os }}
          path: |
            tmp/checks/run-*/summary.json
            tmp/checks/run-*/python.xml
            tmp/checks/run-*/python.log
            tmp/checks/run-*/frontend.log
          retention-days: 7
          if-no-files-found: warn
      - name: Export installed package versions
        if: ${{ !cancelled() }}
        run: uv run --no-sync python scripts/checks/audit_requirements.py
      - name: Audit installed locked dependencies (advisory network allowed)
        if: ${{ !cancelled() && hashFiles('tmp/audit-requirements.txt') != '' }}
        run: uv tool run --from pip-audit==2.9.0 pip-audit --no-deps --disable-pip -r tmp/audit-requirements.txt
