[project]
name = "paper-research-assistant"
version = "0.1.0"
description = "Literature discovery and evidence analysis agent"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0,<3.0",
    "openai>=3.35.1",
    "pypdf>=6.0,<7.0",
    "sentence-transformers>=6.0,<7.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paper_assistant"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
